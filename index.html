    const state = {
      view: 'mindmap',
      selectedNodeId: null,
      collapsedIds: new Set(),
      pan: { x: 0, y: 0 },
      zoom: 1,
    };

    function findNodeById(id, node = MINDMAP_TREE) {
      if (node.id === id) return node;
      if (node.children) {
        for (const child of node.children) {
          const found = findNodeById(id, child);
          if (found) return found;
        }
      }
      return null;
    }

    function getMainBranchStyle(nodeId, current = MINDMAP_TREE, inherited = null) {
      if (current.color) {
        inherited = {
          color: current.color,
          bgLight: current.bgLight,
          border: current.border,
          textClass: current.textClass,
          badgeClass: current.badgeClass,
          icon: current.icon,
          rootBranchId: current.id,
        };
      }
      if (current.id === nodeId) return inherited;
      if (current.children) {
        for (const ch of current.children) {
          const res = getMainBranchStyle(nodeId, ch, inherited);
          if (res) return res;
        }
      }
      return inherited || {
        color: '#4f46e5',
        bgLight: '#eef2ff',
        border: '#a5b4fc',
        textClass: 'text-indigo-700',
        badgeClass: 'bg-indigo-600',
        icon: 'git-fork',
        rootBranchId: 'root',
      };
    }

    function getBreadcrumbPath(targetId, current = MINDMAP_TREE, path = []) {
      const nextPath = [...path, current];
      if (current.id === targetId) return nextPath;
      if (current.children) {
        for (const ch of current.children) {
          const found = getBreadcrumbPath(targetId, ch, nextPath);
          if (found) return found;
        }
      }
      return null;
    }

    function goToMindmap() {
      state.view = 'mindmap';
      state.selectedNodeId = null;
      render();
    }

    function openDetail(nodeId) {
      const node = findNodeById(nodeId);
      if (!node || !node.detail) return;
      state.view = 'detail';
      state.selectedNodeId = nodeId;
      window.scrollTo({ top: 0, behavior: 'smooth' });
      render();
    }

    function toggleCollapse(event, nodeId) {
      event.stopPropagation();
      if (state.collapsedIds.has(nodeId)) {
        state.collapsedIds.delete(nodeId);
      } else {
        state.collapsedIds.add(nodeId);
      }
      render();
    }

    function computeTreeLayout() {
      const CENTER_X = 1100;
      const CENTER_Y = 640;
      const L1_GAP_X = 270;
      const L2_GAP_X = 250;
      const L3_GAP_X = 240;
      const LEAF_H = 82;
      const SIBLING_GAP = 14;
      const GROUP_GAP = 26;
      const nodes = [];
      const edges = [];

      nodes.push({
        id: MINDMAP_TREE.id,
        title: MINDMAP_TREE.title,
        subtitle: MINDMAP_TREE.subtitle,
        level: 0,
        side: 'center',
        x: CENTER_X,
        y: CENTER_Y,
        w: 236,
        h: 82,
        hasDetail: false,
        childrenCount: MINDMAP_TREE.children.length,
        isCollapsed: false,
        style: null,
      });

      function measureSubtree(node, depth) {
        const hasChildren = Array.isArray(node.children) && node.children.length > 0;
        const isCollapsed = state.collapsedIds.has(node.id);
        if (!hasChildren || isCollapsed) {
          return LEAF_H;
        }
        let total = 0;
        node.children.forEach((child, idx) => {
          total += measureSubtree(child, depth + 1);
          if (idx < node.children.length - 1) {
            total += depth === 1 ? GROUP_GAP : SIBLING_GAP;
          }
        });
        return Math.max(LEAF_H, total);
      }

      function placeSide(branches, side) {
        const dir = side === 'left' ? -1 : 1;
        const heights = branches.map(b => measureSubtree(b, 1));
        const totalHeight = heights.reduce((a, b) => a + b, 0) + Math.max(0, branches.length - 1) * 44;
        let cursorY = CENTER_Y - totalHeight / 2;

        branches.forEach((b1, idx1) => {
          const h1 = heights[idx1];
          const y1 = cursorY + h1 / 2;
          const x1 = CENTER_X + dir * L1_GAP_X;
          const b1Style = getMainBranchStyle(b1.id);
          const hasL2 = Array.isArray(b1.children) && b1.children.length > 0;
          const isL1Collapsed = state.collapsedIds.has(b1.id);

          nodes.push({
            id: b1.id,
            title: b1.title,
            keyword: b1.keyword,
            level: 1,
            side,
            x: x1,
            y: y1,
            w: 196,
            h: 66,
            hasDetail: Boolean(b1.detail),
            childrenCount: hasL2 ? b1.children.length : 0,
            isCollapsed: isL1Collapsed,
            style: b1Style,
          });

          edges.push({
            fromId: MINDMAP_TREE.id,
            toId: b1.id,
            x1: CENTER_X + dir * (236 / 2),
            y1: CENTER_Y,
            x2: x1 - dir * (196 / 2),
            y2: y1,
            color: b1Style.color,
            width: 3.5,
            level: 1,
          });

          if (hasL2 && !isL1Collapsed) {
            const h2List = b1.children.map(c2 => measureSubtree(c2, 2));
            const totalH2 = h2List.reduce((a, b) => a + b, 0) + Math.max(0, b1.children.length - 1) * GROUP_GAP;
            let cursorY2 = y1 - totalH2 / 2;

            b1.children.forEach((c2, idx2) => {
              const h2 = h2List[idx2];
              const y2 = cursorY2 + h2 / 2;
              const x2 = x1 + dir * L2_GAP_X;
              const hasL3 = Array.isArray(c2.children) && c2.children.length > 0;
              const isL2Collapsed = state.collapsedIds.has(c2.id);

              nodes.push({
                id: c2.id,
                title: c2.title,
                keyword: c2.keyword,
                level: 2,
                side,
                x: x2,
                y: y2,
                w: 184,
                h: 58,
                hasDetail: Boolean(c2.detail),
                childrenCount: hasL3 ? c2.children.length : 0,
                isCollapsed: isL2Collapsed,
                style: b1Style,
              });

              edges.push({
                fromId: b1.id,
                toId: c2.id,
                x1: x1 + dir * (196 / 2),
                y1: y1,
                x2: x2 - dir * (184 / 2),
                y2: y2,
                color: b1Style.color,
                width: 2.25,
                level: 2,
              });

              if (hasL3 && !isL2Collapsed) {
                const totalH3 = c2.children.length * LEAF_H + Math.max(0, c2.children.length - 1) * SIBLING_GAP;
                let cursorY3 = y2 - totalH3 / 2;

                c2.children.forEach((c3) => {
                  const y3 = cursorY3 + LEAF_H / 2;
                  const x3 = x2 + dir * L3_GAP_X;

                  nodes.push({
                    id: c3.id,
                    title: c3.title,
                    keyword: c3.keyword,
                    level: 3,
                    side,
                    x: x3,
                    y: y3,
                    w: 176,
                    h: 52,
                    hasDetail: Boolean(c3.detail),
                    childrenCount: 0,
                    isCollapsed: false,
                    style: b1Style,
                  });

                  edges.push({
                    fromId: c2.id,
                    toId: c3.id,
                    x1: x2 + dir * (184 / 2),
                    y1: y2,
                    x2: x3 - dir * (176 / 2),
                    y2: y3,
                    color: b1Style.color,
                    width: 1.75,
                    level: 3,
                  });

                  cursorY3 += LEAF_H + SIBLING_GAP;
                });
              }

              cursorY2 += h2 + GROUP_GAP;
            });
          }

          cursorY += h1 + 44;
        });
      }

      const leftBranches = MINDMAP_TREE.children.filter(c => c.side === 'left');
      const rightBranches = MINDMAP_TREE.children.filter(c => c.side !== 'left');
      placeSide(leftBranches, 'left');
      placeSide(rightBranches, 'right');

      return { nodes, edges };
    }

    function buildBezierPath(x1, y1, x2, y2) {
      const dx = Math.abs(x2 - x1);
      const ctrlOffset = Math.max(48, dx * 0.52);
      const c1x = x2 > x1 ? x1 + ctrlOffset : x1 - ctrlOffset;
      const c2x = x2 > x1 ? x2 - ctrlOffset : x2 + ctrlOffset;
      return `M ${x1} ${y1} C ${c1x} ${y1}, ${c2x} ${y2}, ${x2} ${y2}`;
    }

    function renderMindmapView() {
      const { nodes, edges } = computeTreeLayout();

      const svgEdges = edges.map(e => {
        const d = buildBezierPath(e.x1, e.y1, e.x2, e.y2);
        return `
          <path
            d="${d}"
            fill="none"
            stroke="${e.color}"
            stroke-width="${e.width}"
            stroke-opacity="${e.level === 1 ? '0.85' : e.level === 2 ? '0.65' : '0.5'}"
            stroke-linecap="round"
            class="bezier-branch"
          />
        `;
      }).join('');

      const nodeElements = nodes.map(n => {
        const leftPos = n.x - n.w / 2;
        const topPos = n.y - n.h / 2;

        if (n.level === 0) {
          return `
            <div
              style="left:${leftPos}px; top:${topPos}px; width:${n.w}px; height:${n.h}px;"
              class="absolute rounded-2xl bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 text-white shadow-xl border-2 border-indigo-400/60 flex flex-col items-center justify-center px-4 text-center z-20"
            >
              <span class="text-[10px] font-bold uppercase tracking-widest text-indigo-300">Sơ đồ tư duy</span>
              <div class="font-extrabold text-sm leading-snug mt-0.5">${n.title}</div>
              <div class="text-[11px] text-slate-300 mt-0.5">${n.subtitle}</div>
            </div>
          `;
        }

        const st = n.style;
        const collapseBtn = n.childrenCount > 0 ? `
          <button
            type="button"
            title="${n.isCollapsed ? 'Mở rộng nhánh con' : 'Thu gọn nhánh con'}"
            onclick="toggleCollapse(event, '${n.id}')"
            style="border-color:${st.color}; color:${st.color};"
            class="w-5 h-5 rounded-full bg-white border font-mono text-xs font-bold flex items-center justify-center shadow-sm hover:scale-110 transition shrink-0"
          >
            ${n.isCollapsed ? '+' : '−'}
          </button>
        ` : '';

        const levelBadge = n.level === 1
          ? `<span class="w-2 h-2 rounded-full shrink-0" style="background:${st.color}"></span>`
          : '';

        return `
          <div
            style="left:${leftPos}px; top:${topPos}px; width:${n.w}px; min-height:${n.h}px; background:${n.level === 1 ? st.bgLight : '#ffffff'}; border-color:${n.level === 1 ? st.color : st.border};"
            onclick="${n.hasDetail ? `openDetail('${n.id}')` : ''}"
            class="tree-node-card absolute rounded-xl border-2 shadow-sm hover:shadow-md px-3 py-2 flex items-center justify-between gap-1.5 ${n.hasDetail ? 'cursor-pointer' : ''} z-10"
          >
            <div class="min-w-0 flex-1">
              <div class="flex items-center gap-1.5">
                ${levelBadge}
                <span class="font-bold ${n.level === 1 ? 'text-[13px] ' + st.textClass : n.level === 2 ? 'text-xs text-slate-800' : 'text-[11.5px] text-slate-700'} leading-snug truncate">
                  ${n.title}
                </span>
              </div>
              ${n.keyword ? `<p class="text-[10.5px] text-slate-500 mt-0.5 truncate">${n.keyword}</p>` : ''}
            </div>
            <div class="flex items-center gap-1 shrink-0">
              ${collapseBtn}
              ${n.hasDetail ? `<i data-lucide="chevron-right" class="w-3.5 h-3.5 text-slate-400"></i>` : ''}
            </div>
          </div>
        `;
      }).join('');

      return `
        <div class="flex-1 flex flex-col relative overflow-hidden whiteboard-bg">
          <div class="fixed bottom-5 right-5 z-30 flex items-center gap-1.5 bg-white/95 backdrop-blur border border-slate-200 rounded-xl p-1.5 shadow-lg">
            <button onclick="adjustZoom(-0.12)" title="Thu nhỏ" class="w-8 h-8 rounded-lg hover:bg-slate-100 flex items-center justify-center text-slate-700 font-bold">
              <i data-lucide="zoom-out" class="w-4 h-4"></i>
            </button>
            <span id="zoom-label" class="px-2 text-xs font-mono font-semibold text-slate-700 min-w-[46px] text-center">
              ${Math.round(state.zoom * 100)}%
            </span>
            <button onclick="adjustZoom(0.12)" title="Phóng to" class="w-8 h-8 rounded-lg hover:bg-slate-100 flex items-center justify-center text-slate-700 font-bold">
              <i data-lucide="zoom-in" class="w-4 h-4"></i>
            </button>
            <div class="w-px h-5 bg-slate-200 mx-0.5"></div>
            <button onclick="resetView()" title="Căn giữa sơ đồ" class="px-2.5 h-8 rounded-lg hover:bg-indigo-50 text-indigo-700 text-xs font-semibold flex items-center gap-1">
              <i data-lucide="maximize-2" class="w-3.5 h-3.5"></i>
              <span>Căn giữa</span>
            </button>
          </div>

          <div class="sm:hidden px-4 pt-3 z-20">
            <div class="bg-white/90 border border-slate-200 rounded-xl px-3 py-2 text-xs text-slate-600 flex items-center gap-2 shadow-sm">
              <i data-lucide="hand" class="w-4 h-4 text-indigo-600 shrink-0"></i>
              <span>Kéo để di chuyển sơ đồ, chạm vào nhánh để xem chi tiết.</span>
            </div>
          </div>

          <div id="mindmap-canvas" class="mindmap-viewport flex-1 w-full relative overflow-hidden min-h-[540px]">
            <div
              id="mindmap-transform-layer"
              style="transform: translate(${state.pan.x}px, ${state.pan.y}px) scale(${state.zoom}); transform-origin: 0 0;"
              class="w-[2200px] h-[1280px] relative"
            >
              <svg width="2200" height="1280" class="absolute inset-0 pointer-events-none">
                ${svgEdges}
              </svg>
              ${nodeElements}
            </div>
          </div>
        </div>
      `;
    }

    function renderDetailSection(sec) {
      if (sec.type === 'text-list') {
        return `
          <div class="bg-white rounded-2xl border border-slate-200 p-5 sm:p-6 shadow-sm">
            <h3 class="text-base font-bold text-slate-900 mb-3 flex items-center gap-2">
              <i data-lucide="book-open" class="w-4 h-4 text-indigo-600"></i>
              <span>${sec.title}</span>
            </h3>
            <ul class="space-y-2.5 text-sm sm:text-[15px] text-slate-700 leading-relaxed list-disc pl-5">
              ${sec.items.map(item => `<li>${item}</li>`).join('')}
            </ul>
          </div>
        `;
      }

      if (sec.type === 'example-list') {
        return `
          <div class="bg-white rounded-2xl border border-slate-200 p-5 sm:p-6 shadow-sm">
            <h3 class="text-base font-bold text-slate-900 mb-3 flex items-center gap-2">
              <i data-lucide="sparkles" class="w-4 h-4 text-amber-600"></i>
              <span>${sec.title}</span>
            </h3>
            <div class="space-y-2.5">
              ${sec.items.map(item => `
                <div class="p-3.5 rounded-xl bg-amber-50/70 border border-amber-200/80 text-sm sm:text-[15px] text-slate-800 leading-relaxed">
                  ${item}
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      if (sec.type === 'compare-grid') {
        return `
          <div class="bg-white rounded-2xl border border-slate-200 p-5 sm:p-6 shadow-sm">
            <h3 class="text-base font-bold text-slate-900 mb-4 flex items-center gap-2">
              <i data-lucide="columns-2" class="w-4 h-4 text-indigo-600"></i>
              <span>${sec.title}</span>
            </h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div class="rounded-xl border border-blue-200 bg-blue-50/50 p-4">
                <div class="font-bold text-blue-900 text-sm mb-1.5">${sec.left.head}</div>
                <p class="text-sm text-slate-700 mb-3">${sec.left.body}</p>
                <p class="text-xs font-semibold uppercase tracking-wider text-blue-700 mb-1.5">Ví dụ:</p>
                <ul class="text-xs sm:text-sm text-slate-700 space-y-1 list-disc pl-4">
                  ${sec.left.examples.map(ex => `<li>${ex}</li>`).join('')}
                </ul>
              </div>
              <div class="rounded-xl border border-violet-200 bg-violet-50/50 p-4">
                <div class="font-bold text-violet-900 text-sm mb-1.5">${sec.right.head}</div>
                <p class="text-sm text-slate-700 mb-3">${sec.right.body}</p>
                <p class="text-xs font-semibold uppercase tracking-wider text-violet-700 mb-1.5">Ví dụ:</p>
                <ul class="text-xs sm:text-sm text-slate-700 space-y-1 list-disc pl-4">
                  ${sec.right.examples.map(ex => `<li>${ex}</li>`).join('')}
                </ul>
              </div>
            </div>
          </div>
        `;
      }

      if (sec.type && sec.type.startsWith('svg-')) {
        return renderSvgIllustration(sec.type);
      }

      return '';
    }

    function renderDetailView() {
      const node = findNodeById(state.selectedNodeId);
      if (!node || !node.detail) return renderMindmapView();

      const st = getMainBranchStyle(node.id);
      const trail = getBreadcrumbPath(node.id) || [];

      const breadcrumbHtml = trail.map((item, index) => {
        const isLast = index === trail.length - 1;
        if (item.id === 'root') {
          return `
            <button onclick="goToMindmap()" class="text-slate-500 hover:text-indigo-600 font-medium transition">
              Sơ đồ cây
            </button>
          `;
        }
        if (isLast) {
          return `<span class="font-bold ${st.textClass}">${item.title}</span>`;
        }
        return `
          <button onclick="openDetail('${item.id}')" class="text-slate-600 hover:text-indigo-600 font-medium transition">
            ${item.title}
          </button>
        `;
      }).join('<i data-lucide="chevron-right" class="w-3.5 h-3.5 text-slate-400 shrink-0"></i>');

      const childLinksHtml = Array.isArray(node.children) && node.children.length > 0 ? `
        <div class="bg-white rounded-2xl border border-slate-200 p-5 sm:p-6 shadow-sm">
          <h3 class="text-sm font-bold uppercase tracking-wider text-slate-500 mb-3">Các nhánh nhỏ trực thuộc</h3>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            ${node.children.map(ch => `
              <button
                onclick="openDetail('${ch.id}')"
                style="border-color:${st.border};"
                class="text-left p-3.5 rounded-xl border hover:bg-slate-50 transition flex items-center justify-between gap-2 group"
              >
                <div>
                  <div class="font-bold text-sm text-slate-900 group-hover:text-indigo-600 transition">${ch.title}</div>
                  ${ch.keyword ? `<div class="text-xs text-slate-500 mt-0.5">${ch.keyword}</div>` : ''}
                </div>
                <i data-lucide="arrow-right" class="w-4 h-4 text-slate-400 group-hover:translate-x-0.5 transition shrink-0"></i>
              </button>
            `).join('')}
          </div>
        </div>
      ` : '';

      const sectionsHtml = (node.detail.sections || []).map(renderDetailSection).join('');

      const noteHtml = node.detail.note ? `
        <div class="rounded-2xl bg-slate-100 border border-slate-200 p-4 sm:p-5 flex items-start gap-3">
          <div class="w-8 h-8 rounded-lg bg-indigo-100 text-indigo-700 flex items-center justify-center shrink-0 mt-0.5">
            <i data-lucide="lightbulb" class="w-4 h-4"></i>
          </div>
          <p class="text-sm text-slate-700 leading-relaxed">${node.detail.note}</p>
        </div>
      ` : '';

      return `
        <div class="page-enter max-w-4xl w-full mx-auto px-4 sm:px-6 py-7 space-y-6">
          <nav class="flex flex-wrap items-center gap-1.5 text-xs sm:text-sm">
            ${breadcrumbHtml}
          </nav>

          <div style="background:${st.bgLight}; border-color:${st.border};" class="rounded-2xl border-2 p-5 sm:p-7 shadow-sm">
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full text-white text-xs font-bold mb-3 ${st.badgeClass}">
              <i data-lucide="${st.icon}" class="w-3.5 h-3.5"></i>
              <span>${node.keyword || 'Kiến thức trọng tâm'}</span>
            </div>
            <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">${node.title}</h1>
            <p class="mt-2.5 text-sm sm:text-base text-slate-700 leading-relaxed">${node.detail.lead}</p>
          </div>

          <div class="space-y-5">
            ${sectionsHtml}
          </div>

          ${childLinksHtml}

          ${noteHtml}
        </div>
      `;
    }

    let isDragging = false;
    let dragStart = { x: 0, y: 0 };

    function applyTransform() {
      const layer = document.getElementById('mindmap-transform-layer');
      const label = document.getElementById('zoom-label');
      if (layer) {
        layer.style.transform = `translate(${state.pan.x}px, ${state.pan.y}px) scale(${state.zoom})`;
      }
      if (label) {
        label.textContent = `${Math.round(state.zoom * 100)}%`;
      }
    }

    function adjustZoom(delta) {
      state.zoom = Math.min(1.6, Math.max(0.45, Number((state.zoom + delta).toFixed(2))));
      applyTransform();
    }

    function resetView() {
      const canvas = document.getElementById('mindmap-canvas');
      const vw = canvas ? canvas.clientWidth : window.innerWidth;
      const vh = canvas ? canvas.clientHeight : window.innerHeight - 64;
      state.zoom = vw < 768 ? 0.56 : 0.85;
      state.pan.x = Math.round(vw / 2 - 1100 * state.zoom);
      state.pan.y = Math.round(vh / 2 - 640 * state.zoom);
      applyTransform();
    }

    function bindCanvasEvents() {
      const canvas = document.getElementById('mindmap-canvas');
      if (!canvas) return;

      canvas.addEventListener('pointerdown', (e) => {
        if (e.target.closest('.tree-node-card') || e.target.closest('button')) return;
        isDragging = true;
        dragStart = { x: e.clientX - state.pan.x, y: e.clientY - state.pan.y };
        canvas.setPointerCapture(e.pointerId);
      });

      canvas.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        state.pan.x = e.clientX - dragStart.x;
        state.pan.y = e.clientY - dragStart.y;
        applyTransform();
      });

      canvas.addEventListener('pointerup', (e) => {
        if (isDragging) {
          isDragging = false;
          try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
        }
      });

      canvas.addEventListener('wheel', (e) => {
        e.preventDefault();
        const delta = e.deltaY < 0 ? 0.08 : -0.08;
        adjustZoom(delta);
      }, { passive: false });
    }

    function render() {
      const appRoot = document.getElementById('app-root');
      const btnBack = document.getElementById('btn-back-tree');
      const hint = document.getElementById('mindmap-header-hint');

      if (state.view === 'mindmap') {
        btnBack.classList.add('hidden');
        btnBack.classList.remove('flex');
        hint.classList.remove('hidden');
        appRoot.innerHTML = renderMindmapView();
        lucide.createIcons();
        bindCanvasEvents();
        if (state.pan.x === 0 && state.pan.y === 0) {
          resetView();
        }
      } else {
        btnBack.classList.remove('hidden');
        btnBack.classList.add('flex');
        hint.classList.add('hidden');
        appRoot.innerHTML = renderDetailView();
        lucide.createIcons();
      }
    }

    document.addEventListener('DOMContentLoaded', render);
  </script>
</body>
</html>
